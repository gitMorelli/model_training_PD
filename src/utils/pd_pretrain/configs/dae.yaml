experiment:
  name: dae
  seed: 42
  #debugging
  debugging_callbacks: True
  fast_dev_run: False #can be False, null or True, False and null have same behavior
  debug: False
  #training modality
  selected_properties: [] #['etudegp', 'profq2', 'lateralite', 'relative_age', 'case_dt_dateq*'], #null or [] means no conditioning on covariates
  #['etudegp', 'profq2', 'lateralite', 'relative_age', 'case_dt_dateq*']
  global_fusion: late #early, late
  #experiment parameters
  data_modality_name: patch_view_balanced #mixed_view, window_view, window_view_minimal
  filter_modality: digit
  #Transforms definitions
  norm_mu: minus_one_one
  norm_std: minus_one_one
  custom_transform: 2xcrop_resize_normalize #'2xcrop_resize_normalize',#'crop_normalize', ##'pad_resize_normalize', #null, #if not null overrides the transform defined for the model with ta custom one
  input_size: 32 #224,32
  apply_augmentation: null #null, 'random_crop_half' ; if data_modality is a list the transform for each view mode will be determined
  #in the code based on the view name
  invert_color: True
  to_grayscale: True #if True converts the images to grayscale (1 channel) before feeding them to the model
  image_pixel_space_augmentations: null #null, #null, ALL,NO_AUG,PHOTO_ONLY,GEOM_ONLY ; null and NO_AUG are equivalent but null skips the function call
  #Training params definition
  epochs: 10
  val_check_interval: 0.25 #validate every 25% of the training epoch
  max_val_samples: 2000 #reduce the number of samples in the validation set to 1000 for pre-training
  accumulate_grad_batches: 4 #8,   # effective batch = batch_size * accumulate_grad_batches or null
  unsupervised_kwargs: {'n_im_per_subj': 10, 'replace':True, 'val_seed': 42, 'input_range': "ink_pm1"}
  subj_per_batch: 4 #number of subjects per batch, if null uses batch_size instead
  prefetch_factor: 4

model:
  class_path: src.utils.pd_pretrain.pdhw.DenoisingAE
  init_args:
    channels: [32, 64, 128] #128->[32, 64, 128, 128, 128]      
    blocks_per_stage: 2
    latent_channels: 8
    cond_dim: 64
    fg_weight: 5.0
    grad_weight: 1.0
    fft_weight: 0.0
    corruption:
      p_block: 0.5
      block_frac: [0.1, 0.25] #128 -> [0.05, 0.12] 
      n_stroke_erasures: 2 #128 -> 8
      stroke_erase_frac: 0.08 #128 -> 0.05
      bg_noise_std: 0.05
      speck_prob: 0.002
    lr: 3.0e-4
    weight_decay: 0.05
    warmup_steps: 1000
    ema_decay: 0.999

trainer:
  #added by me
  val_check_interval: 1000          # validate every N training batches
  check_val_every_n_epoch: null     # count those batches across epochs, not within one
  accumulate_grad_batches: 4
  #given
  max_steps: 100000      # optimizer steps; this is also the length of the LR schedule
  max_epochs: -1
  precision: bf16-mixed     # use 32-true on CPU / older GPUs
  gradient_clip_val: 1.0
  log_every_n_steps: 1
  callbacks:
    - class_path: src.utils.pd_pretrain.pdhw.callbacks.PreviewCallback
      init_args: {every_n_val: 1, num_samples: 16}
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args: {monitor: val/loss, save_last: true, save_top_k: 2}
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args: {logging_interval: step}


